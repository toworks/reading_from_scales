database:
            enable: true
            type: mssql # Database type (can be: postgres, mysql, sqlite)
            host: "krr-sql-paclx03"  # Database host address
            port: 1433 # Port to connect to the database
            username: '%MSSQL_USER%' #MUST ADD A DOMAIN! Username to connect to the database
            password: "%MSSQL_PASSWORD%" # Password to connect to the database
            database: "KRR-PA-UNIFIED_WEIGHT_SYSTEM" # Database name
            table: "KEP_Analytics_Weight"

